<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <text x="600" y="40" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e0e7ff">How Every Problem Gets Solved</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="75" width="170" height="100" rx="14" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8"/>
    <text x="115" y="108" font-size="26" fill="#a5b4fc" font-weight="800">1</text>
    <text x="115" y="136" font-size="17" font-weight="700" fill="#fff">Understand</text>
    <text x="115" y="158" font-size="13" fill="#c7d2fe">inputs, edge cases</text>

    <rect x="235" y="75" width="170" height="100" rx="14" fill="#0d9488" fill-opacity="0.3" stroke="#5eead4"/>
    <text x="320" y="108" font-size="26" fill="#5eead4" font-weight="800">2</text>
    <text x="320" y="136" font-size="17" font-weight="700" fill="#fff">Brute Force</text>
    <text x="320" y="158" font-size="13" fill="#99f6e4">simplest correct idea</text>

    <rect x="440" y="75" width="170" height="100" rx="14" fill="#7c3aed" fill-opacity="0.3" stroke="#c4b5fd"/>
    <text x="525" y="108" font-size="26" fill="#c4b5fd" font-weight="800">3</text>
    <text x="525" y="136" font-size="17" font-weight="700" fill="#fff">Optimize</text>
    <text x="525" y="158" font-size="13" fill="#ddd6fe">spot the pattern</text>

    <rect x="645" y="75" width="170" height="100" rx="14" fill="#db2777" fill-opacity="0.28" stroke="#f9a8d4"/>
    <text x="730" y="108" font-size="26" fill="#f9a8d4" font-weight="800">4</text>
    <text x="730" y="136" font-size="17" font-weight="700" fill="#fff">Code</text>
    <text x="730" y="158" font-size="13" fill="#fbcfe8">clean and commented</text>

    <rect x="850" y="75" width="150" height="100" rx="14" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8"/>
    <text x="925" y="108" font-size="26" fill="#a5b4fc" font-weight="800">5</text>
    <text x="925" y="136" font-size="17" font-weight="700" fill="#fff">Analyze</text>
    <text x="925" y="158" font-size="13" fill="#c7d2fe">time and space</text>

    <rect x="1035" y="75" width="135" height="100" rx="14" fill="#0d9488" fill-opacity="0.3" stroke="#5eead4"/>
    <text x="1102" y="108" font-size="26" fill="#5eead4" font-weight="800">6</text>
    <text x="1102" y="136" font-size="17" font-weight="700" fill="#fff">Commit</text>
    <text x="1102" y="158" font-size="13" fill="#99f6e4">push to GitHub</text>
  </g>
  <g stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="202" y1="125" x2="232" y2="125"/>
    <line x1="407" y1="125" x2="437" y2="125"/>
    <line x1="612" y1="125" x2="642" y2="125"/>
    <line x1="817" y1="125" x2="847" y2="125"/>
    <line x1="1002" y1="125" x2="1032" y2="125"/>
  </g>
