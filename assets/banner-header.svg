<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <circle cx="940" cy="150" r="230" fill="url(#glow)"/>
  <!-- faint complexity notes -->
  <g font-family="Consolas, Menlo, monospace" font-size="20" fill="#ffffff" opacity="0.10">
    <text x="520" y="60">O(log n)</text>
    <text x="640" y="290">O(n log n)</text>
    <text x="40" y="300">while (l &lt;= r) { ... }</text>
    <text x="1040" y="300">dp[i][j]</text>
  </g>
  <!-- binary tree -->
  <g stroke="#a5b4fc" stroke-width="3" opacity="0.8">
    <line x1="940" y1="80" x2="860" y2="150"/>
    <line x1="940" y1="80" x2="1020" y2="150"/>
    <line x1="860" y1="150" x2="820" y2="230"/>
    <line x1="860" y1="150" x2="900" y2="230"/>
    <line x1="1020" y1="150" x2="980" y2="230"/>
    <line x1="1020" y1="150" x2="1060" y2="230"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">
    <circle cx="940" cy="80" r="26" fill="#5eead4"/><text x="940" y="87">8</text>
    <circle cx="860" cy="150" r="24" fill="#a5b4fc"/><text x="860" y="157">3</text>
    <circle cx="1020" cy="150" r="24" fill="#a5b4fc"/><text x="1020" y="157">10</text>
    <circle cx="820" cy="230" r="22" fill="#e0e7ff"/><text x="820" y="237">1</text>
    <circle cx="900" cy="230" r="22" fill="#e0e7ff"/><text x="900" y="237">6</text>
    <circle cx="980" cy="230" r="22" fill="#e0e7ff"/><text x="980" y="237">9</text>
    <circle cx="1060" cy="230" r="22" fill="#e0e7ff"/><text x="1060" y="237">14</text>
  </g>
  <!-- title -->
  <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="120" font-weight="800" fill="url(#title)" letter-spacing="4">DSA</text>
  <text x="64" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e0e7ff">LeetCode Solutions</text>
  <text x="64" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c7d2fe">Data Structures &amp; Algorithms, solved and explained</text>
  <!-- pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="64" y="256" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="124" y="276" fill="#ffffff">Arrays</text>
    <rect x="196" y="256" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="256" y="276" fill="#ffffff">Trees</text>
    <rect x="328" y="256" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="388" y="276" fill="#ffffff">Graphs</text>
    <rect x="460" y="256" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.14"/>
    <text x="520" y="276" fill="#ffffff">DP</text>
  </g>
</svg>
