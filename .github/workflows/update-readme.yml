name: Update README

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "assets/progress.svg"
      - "scripts/problems_cache.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README stats
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/progress.svg scripts/problems_cache.json
          git diff --cached --quiet || git commit -m "docs: auto-update README stats [skip ci]"
          git push
